<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Animated request trace: client to Cloudflare to Kong to Go service to Postgres">
<style>
.t{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3}
.s{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590}
.log{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7ee787}
.ring{fill:none;stroke:#39d353;stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0;animation:p .8s ease-out infinite}
@keyframes p{0%{opacity:.9;transform:scale(.6)}70%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
.fr{animation-name:pf;animation-duration:4.8s}
@keyframes pf{0%{opacity:.9;transform:scale(.6)}12%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
.static{display:none}
@media (prefers-reduced-motion:reduce){.ring,.pk,.anim{display:none}.static{display:inline}.cur{animation:none}}
</style>
<defs><filter id="g" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="80" x2="780"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#39d353"/></linearGradient></defs>
